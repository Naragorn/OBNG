; OBNG shadow mode. Every switch puts a detour on a function of Oblivion.exe
; 1.2.0.416 that runs the game's original AND OBNG's rebuild (on a copy of
; the state) and compares the two bit for bit. The game always continues with
; the original's result; the comparison goes to OBNG.log next to Oblivion.exe
; ("Shadow MISMATCH ..." lines and a "Shadow: ..." summary).
;
; An OBNG-test.ini next to the DLL replaces this file for a harness run
; (tools/shadow-run.sh writes and removes it).

[Shadow]
; Off for play: OBVR's [Render] PreciseFrameClock patches the same entry, and
; whoever patches second steps aside - with this on, OBVR's precise clock
; would be lost. The harness turns it on and OBVR's clock off for the run.
TimeInfoUpdate=0
TimeInfoInit=1
TimeInfoFreeze=1
TimeInfoUnfreeze=1
LoadingMenuTick=1
LoadingMenuCtor=1
; ShadowSceneLight::CollectGeometryInRange 0x007D59E0 (the shadow light's
; range walk) against OBNG's batched rebuild: per walk the original runs with
; its AddGeometry calls recorded, then the rebuild walks the same scene a
; second time and the two are compared. Off for play: every drawn actor-shadow
; light is walked twice a frame. The harness turns it on for the run.
RangeWalk=0
; Which side of the range-walk shadow runs first: original-first (the gate as
; it ran) or rebuild-first (a diagnostic: BatchedWalk reads the scene before
; the original touches it; a mismatch line then names the first scene read
; that differs before and after the original, and whether the light changed).
RangeWalkOrder=original-first
; The CRT square root _CIsqrt 0x00982C30 against OBNG's dispatch
; (plugin/src/FastSqrtLogic.h): per call the x87 state is saved, the
; original and the dispatch run from it and the 80-bit result, the control
; word and the exception flags are compared; the game continues with the
; original's. Two square roots and two FXRSTORs per call: a gate run, off in
; play.
Sqrt=0
; NiAVObject::Update 0x00707370, as ActorAnimData::ApplyAnimData 0x00471F20 calls
; it for one actor's skeleton a call, against OBNG's flat subtree run
; (src/engine/scene/SceneUpdateLogic.h): the original runs, its world
; transforms and bounds are kept, the state is put back, the flat run runs,
; and the two are compared per object bit for bit; the game continues with
; the original's. The heads' own subtrees and the collision objects run
; twice: a gate run, off in play. Not beside [Probe] SceneUpdate.
ActorUpdate=0

[Route]
; ShadowSceneLight::CollectGeometryInRange 0x007D59E0 RUN by OBNG's batched
; rebuild instead of the original (it passed its in-game gate: 0 mismatches
; over 54 369 walks, artifacts/shadow/obng-range-walk/20261030-120624), for
; measuring its cost against the original's. Off for play until measured.
; With [Shadow] RangeWalk=1 as well the shadow wins and this is skipped.
RangeWalk=0
; The CRT square root _CIsqrt 0x00982C30 RUN by OBNG's dispatch: a finite,
; non-negative argument under the game's control words gets its FSQRT and
; nothing else, where the CRT runs its exception-reporting path for every
; inexact result (1.7 % of the render thread's out-of-pass samples and 1.2 %
; of the in-pass samples on the Gold Road, knowledge/render-thread-outside-
; the-pass.md). Negative, infinite and NaN arguments and unusual control
; words continue in the original. On since 2026-11-08: verified in the game
; (65 443 293 calls compared, 0 mismatches) and measured routed (the CRT's
; error path gone from the samples; docs/subsystems/crt-square-root.md).
; With [Shadow] Sqrt=1 as well the shadow wins and this is skipped.
Sqrt=1
; NiAVObject::Update 0x00707370 from ApplyAnimData RUN by OBNG's flat subtree
; update: the same controllers, world transforms (bit for bit) and bounds in
; the same order, without the recursion's virtual calls; a shape the flat
; order cannot describe goes to the original. On since 2026-11-09 on Nadi's
; go: verified in the game (374 191 calls compared, 0 mismatches) and
; measured against the timed original (13.3 against 21.2 us an actor on the
; Gold Road, 22 against 34 us with 124 actors; docs/subsystems/
; scene-update.md). With [Shadow] ActorUpdate=1 as well the shadow wins and
; this is skipped. Not beside [Probe] SceneUpdate.
ActorUpdate=1
; Inside the frame's loop over the high actors (0x00677EC0) each actor's
; skeleton update (ActorAnimData::ApplyAnimData 0x00471F20) is noted instead
; of run, and all of them run after the loop: first every subtree, then the
; upward passes in the loop's order. The step before spreading the subtrees
; over threads; by itself it changes the order only - an actor's own update
; continues with its skeleton of the frame before (docs/subsystems/
; actor-batch.md). The player and an actor new this frame run in place.
; Needs ActorUpdate=1. Off until measured and looked at.
ActorBatch=0
; In the actors' route: the bones nothing hangs on are left out - a node
; whose name is in OBNG-unused-bones.txt (the installed skeleton's names
; that no skeleton of the game has; tools/re/unused-bone-names.py writes
; it), without a collision object, with no geometry skinned to it, and with
; only such nodes below it. A replaced skeleton with 295 nodes against the
; game's 71 makes a skeleton update 39 us instead of 16. Needs ActorUpdate=1.
; Off until measured and looked at.
ActorUnusedBones=0
; The constant map's entry arranging (0x009A97B0, called about 570 times a
; frame in a town) left out when its entries are already in order: the
; walk then only takes and drops a reference per entry, two interlocked
; calls each. Gate clean 2026-11-10 (8.6 M calls, 0 mismatches); the scene
; pass 3.84 -> 3.66 ms in Anvil (one pair of runs). On since 2026-11-10 (Nadi).
ConstantArrange=1
; The cells' selected update (NiAVObject 0x007073A0 as TESObjectCELL::
; UpdateSelectedNodes 0x004D4970 calls it: the whole of the grid update, 0.9-
; 1.5 ms a frame on the Gold Road) RUN by OBNG's flat selected run. Off
; until its gate is clean and its cost measured.
GridUpdate=0
; A volatile geometry's pack (a named NPC's head: 0.3 MB copied once or twice
; a frame per NPC, half of a crowd's scene pass) is left out when its
; positions and normals equal the ones of its last pack and nobody else has
; written its vertex buffers since - the packer's own early-out runs
; instead. Off until its gate is clean and the picture checked.
VolatilePack=0
; NiDX9Renderer::DrawPrimitive 0x007672F0 and DrawSkinnedPrimitive 0x00767520
; RUN by OBNG's rebuilds (docs/subsystems/single-pass-stereo.md), with the eye
; plan StereoEyes: 1 is the 1:1 gate (the same calls as the originals), 2 the
; double draw: every partition drawn twice when eye data exists - set by OBVR
; through OBNG.dll's ObngStereoSetEyes (plugin/src/StereoEyesApi.h) or by
; StereoTestEyeShift below; without eye data the draws stay single. Off in
; play.
StereoDraw=0
StereoEyes=1
; The plugin's own eye data, for costing the eye switch without OBVR's
; double-wide target: the viewport is split in halves (eye 0 left, eye 1
; right) and eye 1 sits this many game units along the camera's right axis
; (OBVR: about 70 units a metre, so 4.5 is a 64 mm pupil distance). The picture
; is two squeezed half-views with the parallax between them - a check, not a
; VR frame. 0 = off.
StereoTestEyeShift=0
; What the eye switch re-applies for the second eye: view = the rebuilt
; ApplyConstants with the view filter on the vertex map (only the constants
; that depend on the view; src/engine/render/ConstantReapply.h), slot14 = the
; shader's slot 14 again (everything, the palettes included; the first
; version, 0.95 ms a pass), none = no constants (the switch's floor for a
; measurement; the second eye's picture is wrong).
StereoReapply=view
; Geometry below the two roots the game puts at the camera every pass (the
; sky, the clouds, the sun) gets the second eye's viewport without the view
; shift: the dual pass centred those roots on each eye in turn, so they had
; no distance; shifted, the second eye would see them as near as their
; meshes are. 0 draws them with the shift, for the comparison.
StereoFollowers=1
; The renderer's direct draw entries (terrain, SpeedTree, grass) draw with
; the constants their caller set up once for a run of geometries. After the
; second eye's draw the route re-applies the first eye's view constants
; there; without it the first eye's later geometries are drawn with the
; second eye's, and the ground's texture layers differ between the eyes.
; 0 leaves them, for the comparison.
StereoRestoreDirect=1
; The particle renderer (the renderer's vtable slot 92) draws through one
; device call of its own, outside the four routed draw functions: spell
; effects and sparks reached the first eye only. The route patches that call
; (0x007667F6) so it runs once per eye. 0 leaves the game's call.
StereoParticles=1
; The engine does not upload every view-dependent constant for every draw:
; the terrain's later texture passes draw with the ModelViewProj the block's
; first pass left on the device. The second eye's re-apply walks the current
; pass's constants only, so such a pass reached the second eye with the first
; eye's matrix - a ground layer without depth between the eyes, and missing
; where its equal-depth test fails. With 1 the route remembers per register
; the pair of values the last re-apply made and gives the second eye the
; remembered one, and the switch back restores every changed register by
; value (StereoRestoreDirect's re-apply is then not used). 0 for the
; comparison.
StereoCarryConstants=1
; A trace for the route's own development: in every sixteenth single-pass
; frame the device's vertex registers are read back around each routed
; draw's eye switch, and a line per shader class and pass says which
; registers the second eye's draw has of its own. Off in play.
StereoTraceConstants=0
; The occlusion culler (a prototype for the measurement, off in play): in the
; single-pass eye pass every shape and direct draw's world bound is projected
; into both eyes and, after the pass, drawn as rectangles at the bound's
; nearest depth inside an occlusion query against the finished depth buffer.
; A geometry whose query of the last OcclusionCullMaxAge frames counted no
; pixel - hidden in both eyes - is not drawn; it is still tested every frame
; and comes back as soon as a test sees it. The rectangles grow by
; OcclusionCullMargin pixels; a verdict is not acted on after the camera
; moved more than OcclusionCullMaxMove units or turned more than
; OcclusionCullMaxTurn degrees since it was made. The summary says how many
; skips the same pass's test confirmed (the bound hidden: nothing could have
; shown) and how many it did not - the popping's upper bound. Needs StereoDraw=1 and
; OBVR's single pass; not beside [Probe] PassSteps, ConstantUploads or
; Occlusion (they share entries). The queries are never released: a device
; reset with it on fails.
OcclusionCull=0
; With the culler: a scene node below which every draw was hidden is tested
; by its own bound and, hidden, not visited by the cull walk at all - its
; draws are then neither collected by the engine nor asked about (what the
; engine does with a node outside the frustum). Two more detours (the eye
; pass's driver 0x007C78D0, NiCullingProcess::Cull 0x0070DFB0). In Anvil
; 31-58 nodes a pass are left out and a quarter of the asks go; the
; pictures at fixed spots are the same. Off until measured twice and looked
; at in the headset.
OcclusionCullNodes=0
OcclusionCullMaxAge=2
OcclusionCullMargin=2
OcclusionCullMaxMove=100
OcclusionCullMaxTurn=10
; OcclusionCullFlat=1 lets the culler run without OBVR's eye data too: the
; flat game's one camera a pass, the render target as its viewport. For the
; flat game only - OBVR's dual pass has two cameras a frame and would share
; one verdict table; its single pass hands the eye data over and is not
; affected by this key.
OcclusionCullFlat=0
; OcclusionCullTrace=N logs N eye passes in detail (one in 75): the camera,
; the surfaces and viewport at the pass and at the tests, two control
; rectangles (both eyes whole at depth 0 and 1) and the first 24 tests with
; their rectangles, depths and pixel counts. For the measurement runs; 0 off.
OcclusionCullTrace=0

[Fix]
; The game's grass vertex shaders fade a blade by the length of its
; clip-space position, which depends on the frustum and on where in the
; picture the blade stands: 1.41 times the distance in the middle of the
; view, about as much as the distance at the edge of a headset's wide
; frustum. Grass between the two comes and goes as the head turns. With 1
; the grass shaders are replaced, as the game binds them, by twins that
; fade by the distance from the camera. 0 leaves the game's shaders.
GrassFade=1
; How far the grass reaches with the fix. game: as far as the game has it
; straight ahead, now everywhere in the picture. ini: fGrassStartFadeDistance
; and fGrassEndDistance are distances in units; grass then reaches 41 %
; further and more of it is drawn.
GrassFadeReach=game

[Probe]
; The x87 control word at the first update (precision control decides how
; rebuilt float code must be compiled and tested). Needs TimeInfoUpdate.
FpuControlWord=1
; The Havok step planner's outputs sampled every frame (update type, steps
; per frame), to settle the static reading against OBVR's measurement.
; Needs TimeInfoUpdate.
HavokPlanner=1
; The scene pass's hot functions counted per return site every summary
; (SetupTransformations 0x007C9230, NiCullingProcess::Cull, IsInRange,
; CopyVertexStreamElements, NiBound::WhichSide). Off for play: WhichSide
; runs for every plane of every object and the count costs a few percent.
CallCounters=0
; Nine steps of the scene pass timed (calls and milliseconds per summary,
; inclusive, nested): the shader accumulator's finish 0x007AE070 (also by
; return site), Do_RenderShape 0x007693E0, DrawSkinnedPrimitive 0x00767520,
; the shader's slots 13 / 15 / 14 (0x007C9230, 0x0077A310, 0x0077A1F0), the
; constant-map apply loop 0x009A8E30, the per-bone upload 0x00783180 and the
; constant upload 0x007830C0. Off for play: one RDTSC pair per call.
PassSteps=0
; Every packed vertex stream hashed at its unlock and compared with the last
; pack of the same (geometry, partition, chip): how many packs a cross-frame
; cache would skip (docs/subsystems/stream-packing.md, lever L3). Off for
; play: it hashes every byte the game packs.
PackCache=0
; Every vertex constant upload through the program's slots 0x007830C0 and
; 0x00783180 hashed and compared with the register's last upload: how many
; uploads carried what the register already held, how many within one pass,
; and whether the bone palettes' indices form one run (one device call per
; palette without a gather). Off for play: it hashes every upload.
ConstantUploads=0
; With the stereo route's test mode (StereoTestEyeShift): key the second eye's
; re-applied uploads by constant-map entry (type nibble, predefined id) and say
; which changed with the view and which did not. Turns ConstantUploads on;
; not with PassSteps (they hold the same entry). Off in play.
ViewConstants=0
; Count the renderer's four other draw entries (vtable slots 85 EndBatch, 90,
; 91, 93), the ones beside Do_RenderShape that the stereo route does not
; cover yet. Off in play.
DrawEntries=0
; The scene graph update outside the pass (knowledge/render-thread-outside-the-pass.md):
; GridCellArray::Update timed, the cells, the nodes NiNode::UpdateDownwardPass
; visits, the leaves, UpdateWorldData, the controller walks and how many of
; them find nothing to walk, and the actors' NiAVObject::Update timed - per
; grid update in the summary. Eight detours on hot functions, one RDTSC pair
; on the two timed ones: a few percent while on. Off for play.
SceneUpdate=0
; The occlusion probe: one eye pass in OcclusionEvery is sampled, and every
; geometry drawn in it is asked three things with occlusion queries - did its
; world bound's screen rectangle pass the depth test right before the draw,
; did the draw itself put a pixel down, and does the rectangle still pass on
; the pass's finished depth buffer. The last is the share an occlusion culler
; could leave out (an upper bound: it tests against the best depth there is).
; A sampled pass is slow (a state block around every rectangle), and the
; probe's queries are never released, so a device reset fails with it on:
; a measurement, never on in play. It shares entries with PassSteps,
; DrawEntries, ConstantUploads and [Route] StereoDraw and is turned off
; beside any of them.
Occlusion=0
OcclusionEvery=31
; The unrouted-draw probe: every device draw (IDirect3DDevice9 DrawPrimitive,
; DrawIndexedPrimitive and their UP forms) is sorted by where it falls -
; inside the stereo route, outside it in eye 0's viewport (the second eye
; misses that draw), in another viewport, or with no eye data set - and the
; calling sites of the draws outside the route are listed. Needs [Route]
; StereoDraw=1; hooks the device's vtable. Off in play.
UnroutedDraws=0
; The grass probe, for distant grass that goes and comes as the head turns:
; per world pass the grass patches under the engine's Grass node, those with
; the hidden bit and those the pass drew, each in bands of 1000 units from
; the camera, with the camera's heading and the time of day. A line when a
; pass differs from the last written one (at most ten a second) and one every
; two seconds. Needs [Route] StereoDraw=1. Cheap: it may stay on while
; playing.
Grass=0
; Commit charge, working set and user address space (2 GB without the
; large-address-aware flag, 4 GB with it) every summary, with the peak.
; With it the engine's own heap (MemoryHeap 0x00B02020): how much of its
; block is carved, the highest so far, the blocks. At 100 % a request the
; free lists cannot serve fails.
Memory=1
; The process manager's update 0x00678510 timed: the frame's whole actor
; work (AI and every actor's update). Per summary the calls, the mean, the
; longest and how many took more than 3 ms. One detour, two clock readings
; a frame.
ProcessManager=0
; In the actors' route (needs [Route] ActorUpdate=1): every collision
; object's update checked for writing its own node's transform. Says how
; many skeletons could have their collision updates moved behind the down
; pass (docs/subsystems/actor-batch.md). About 1 us an actor.
CollisionWrites=0
; Once a summary: the actors the engine updated in one frame - how many, how
; far from the player, whether their scene node is hidden, their base
; forms' types and plugins, and each as reference / base / type / distance.
ActorCensus=0

[Log]
MismatchLines=20
SummaryEverySeconds=10
; A thread drives the summary once a second, for runs in which no per-frame
; shadow does (every shadow off, the route on: the measurement runs). Off in
; play: the summary then comes only from the shadows that drive it.
SummaryTimer=0
