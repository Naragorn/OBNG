; OBNG shadow mode. Every switch puts a detour on a function of Oblivion.exe
; 1.2.0.416 that runs the game's original AND OBNG's rebuild (on a copy of
; the state) and compares the two bit for bit. The game always continues with
; the original's result; the comparison goes to OBNG.log next to Oblivion.exe
; ("Shadow MISMATCH ..." lines and a "Shadow: ..." summary).
;
; An OBNG-test.ini next to the DLL replaces this file for a harness run
; (tools/shadow-run.sh writes and removes it).

[Shadow]
; Off for play: OBVR's [Render] PreciseFrameClock patches the same entry, and
; whoever patches second steps aside - with this on, OBVR's precise clock
; would be lost. The harness turns it on and OBVR's clock off for the run.
TimeInfoUpdate=0
TimeInfoInit=1
TimeInfoFreeze=1
TimeInfoUnfreeze=1
LoadingMenuTick=1
LoadingMenuCtor=1
; ShadowSceneLight::CollectGeometryInRange 0x007D59E0 (the shadow light's
; range walk) against OBNG's batched rebuild: per walk the original runs with
; its AddGeometry calls recorded, then the rebuild walks the same scene a
; second time and the two are compared. Off for play: every drawn actor-shadow
; light is walked twice a frame. The harness turns it on for the run.
RangeWalk=0
; Which side of the range-walk shadow runs first: original-first (the gate as
; it ran) or rebuild-first (a diagnostic: BatchedWalk reads the scene before
; the original touches it; a mismatch line then names the first scene read
; that differs before and after the original, and whether the light changed).
RangeWalkOrder=original-first

[Route]
; ShadowSceneLight::CollectGeometryInRange 0x007D59E0 RUN by OBNG's batched
; rebuild instead of the original (it passed its in-game gate: 0 mismatches
; over 54 369 walks, artifacts/shadow/obng-range-walk/20261030-120624), for
; measuring its cost against the original's. Off for play until measured.
; With [Shadow] RangeWalk=1 as well the shadow wins and this is skipped.
RangeWalk=0

[Probe]
; The x87 control word at the first update (precision control decides how
; rebuilt float code must be compiled and tested). Needs TimeInfoUpdate.
FpuControlWord=1
; The Havok step planner's outputs sampled every frame (update type, steps
; per frame), to settle the static reading against OBVR's measurement.
; Needs TimeInfoUpdate.
HavokPlanner=1
; The scene pass's hot functions counted per return site every summary
; (SetupTransformations 0x007C9230, NiCullingProcess::Cull, IsInRange,
; CopyVertexStreamElements, NiBound::WhichSide). Off for play: WhichSide
; runs for every plane of every object and the count costs a few percent.
CallCounters=0
; Commit charge, working set and user address space (2 GB without the
; large-address-aware flag, 4 GB with it) every summary, with the peak.
Memory=1

[Log]
MismatchLines=20
SummaryEverySeconds=10
; A thread drives the summary once a second, for runs in which no per-frame
; shadow does (every shadow off, the route on: the measurement runs). Off in
; play: the summary then comes only from the shadows that drive it.
SummaryTimer=0
