; OBNG.ini for players, bundled with OBVR (since beta 9). It goes into
; Data\OBSE\Plugins beside OBNG.dll as OBNG.ini.
;
; What is on: what has passed its gate (re/ledger.md), what OBVR's single pass
; needs, and since 2026-11-16 the routes Nadi plays with in the headset (his
; OBNG.ini of that day, Nadi: take all of them over for beta 9) - the far
; actors' rates, the occlusion culler, draw instancing and the rest under
; "Nadi's play set" below. Everything that compares (Shadow), measures (Probe)
; or is a test switch is off.

[Shadow]
; The original and the rebuild run side by side and are compared: for
; development only, it costs time.
TimeInfoUpdate=0
TimeInfoInit=0
TimeInfoFreeze=0
TimeInfoUnfreeze=0
LoadingMenuTick=0
LoadingMenuCtor=0
RangeWalk=0
Sqrt=0
ActorUpdate=0

[Route]
; The CRT square root's dispatch (verified 2026-11-08, bit-identical).
Sqrt=1
; The actors' skeleton update as a flat loop (verified 2026-11-09, bit-identical).
ActorUpdate=1
; The constant map's arranging left out when nothing is to swap (verified 2026-11-10).
ConstantArrange=1
; OBVR's single pass: every draw goes to both eyes in one scene pass. OBVR asks
; OBNG for this (ObngStereoPlan) and renders two passes itself when it is off.
StereoDraw=1
StereoEyes=2
StereoTestEyeShift=0
StereoReapply=view
StereoFollowers=1
StereoRestoreDirect=1
StereoParticles=1
StereoCarryConstants=1
StereoTraceConstants=0
; Off: not accepted yet, or a different computation on purpose that still waits
; for the look in the headset.
RangeWalk=0
ActorBatch=0
ActorUnusedBones=0
GridUpdate=0
ActorViewHidden=0
OcclusionCullFlat=0
; Nadi's play set (his OBNG.ini of 2026-11-16, the values he plays with in the
; headset; the measurements are in the comments of plugin/OBNG.ini and in docs/).
; A named NPC's head is not packed again while its geometry is unchanged.
VolatilePack=1
; Far actors (beyond ActorFarDistance, about 70 units a metre) update in one
; frame of ActorFarEvery, the whole update with ActorFarWhole; one inside the
; view cone every ActorFarSeenEvery-th; near actors outside the cone (the view
; rule) at the far rate. 1 / 0 turn them off.
ActorFarEvery=16
ActorFarSeenEvery=4
ActorFarDistance=6000
ActorFarWhole=1
ActorViewRule=1
ActorViewConeDegrees=75
ActorViewMinDistance=1000
; Objects with nothing to animate are asked every 4th frame (1 = off).
ReferenceAnimEvery=4
; The occlusion culler, a visible draw tested again in one frame of four.
OcclusionCull=1
OcclusionCullNodes=1
OcclusionCullVisibleEvery=4
OcclusionCullQuick=1
OcclusionCullStandDown=2
OcclusionCullNodeLog=0
OcclusionCullDriverLog=0
; The 3D sound settings committed less often.
SoundCommit=4
; Copies of a mesh drawn as one instanced draw.
DrawInstancing=2
DrawInstancingAlternate=0
; Actors' shadows rendered less often.
ActorShadowEvery=4
ActorShadowStill=4
ActorShadowAlternate=0
; Voice lines decoded off the main thread (minimp3); also the code's default.
VoiceDecode=2
VoiceDecodeTestMissing=0
; The character controller's contact pass by the rebuild.
ContactDedup=1

[Fix]
; The grass fades by distance in both eyes alike (docs/subsystems/grass-fade.md).
GrassFade=1
GrassFadeReach=game

[Probe]
FpuControlWord=0
HavokPlanner=0
CallCounters=0
PassSteps=0
PackCache=0
ConstantUploads=0
ViewConstants=0
DrawEntries=0
SceneUpdate=0
Occlusion=0
UnroutedDraws=0
Grass=0
Memory=0
ProcessManager=0
CollisionWrites=0
ActorCensus=0

[Log]
MismatchLines=20
; The routes' summary lines in OBNG.log, rarely: enough for a report, no flood.
SummaryEverySeconds=300
SummaryTimer=0
