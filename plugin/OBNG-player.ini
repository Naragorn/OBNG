; OBNG.ini for players - a PROPOSAL for the bundle with OBVR (2026-11-12), not yet
; confirmed by Nadi. It goes into Data\OBSE\Plugins beside OBNG.dll as OBNG.ini.
;
; What is on: only what has passed its gate (re/ledger.md) and what OBVR's
; single pass needs. Everything that compares (Shadow), measures (Probe) or is
; still being looked at in the headset is off.

[Shadow]
; The original and the rebuild run side by side and are compared: for
; development only, it costs time.
TimeInfoUpdate=0
TimeInfoInit=0
TimeInfoFreeze=0
TimeInfoUnfreeze=0
LoadingMenuTick=0
LoadingMenuCtor=0
RangeWalk=0
Sqrt=0
ActorUpdate=0

[Route]
; The CRT square root's dispatch (verified 2026-11-08, bit-identical).
Sqrt=1
; The actors' skeleton update as a flat loop (verified 2026-11-09, bit-identical).
ActorUpdate=1
; The constant map's arranging left out when nothing is to swap (verified 2026-11-10).
ConstantArrange=1
; OBVR's single pass: every draw goes to both eyes in one scene pass. OBVR asks
; OBNG for this (ObngStereoPlan) and renders two passes itself when it is off.
StereoDraw=1
StereoEyes=2
StereoTestEyeShift=0
StereoReapply=view
StereoFollowers=1
StereoRestoreDirect=1
StereoParticles=1
StereoCarryConstants=1
StereoTraceConstants=0
; Off: not accepted yet, or a different computation on purpose that still waits
; for the look in the headset.
RangeWalk=0
ActorBatch=0
ActorUnusedBones=0
GridUpdate=0
VolatilePack=0
; Far actors on a lower rate, and the view rule on top of it.
ActorFarEvery=1
ActorFarDistance=6000
ActorFarWhole=0
ActorViewRule=0
ActorViewHidden=0
; The occlusion culler.
OcclusionCull=0
OcclusionCullNodes=0
OcclusionCullFlat=0

[Fix]
; The grass fades by distance in both eyes alike (docs/subsystems/grass-fade.md).
GrassFade=1
GrassFadeReach=game

[Probe]
FpuControlWord=0
HavokPlanner=0
CallCounters=0
PassSteps=0
PackCache=0
ConstantUploads=0
ViewConstants=0
DrawEntries=0
SceneUpdate=0
Occlusion=0
UnroutedDraws=0
Grass=0
Memory=0
ProcessManager=0
CollisionWrites=0
ActorCensus=0

[Log]
MismatchLines=20
; The routes' summary lines in OBNG.log, rarely: enough for a report, no flood.
SummaryEverySeconds=300
SummaryTimer=0
