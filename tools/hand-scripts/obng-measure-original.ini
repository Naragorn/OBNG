; OBNG-test.ini for the range walk's cost measurement, the ORIGINAL side:
; OBNG.dll loaded with every shadow, probe detour and route off - the engine
; as is -, only the memory sample and the summary timer on, exactly as on the
; routed side (obng-measure-routed.ini), so the two runs differ in the route
; alone. Written by tools/shadow-run.sh --ini; see
; tools/hand-scripts/obng-range-walk-original.txt.
[Shadow]
TimeInfoUpdate=0
TimeInfoInit=0
TimeInfoFreeze=0
TimeInfoUnfreeze=0
LoadingMenuTick=0
LoadingMenuCtor=0
RangeWalk=0
[Route]
RangeWalk=0
[Probe]
FpuControlWord=0
HavokPlanner=0
CallCounters=0
Memory=1
[Log]
MismatchLines=20
SummaryEverySeconds=10
SummaryTimer=1
