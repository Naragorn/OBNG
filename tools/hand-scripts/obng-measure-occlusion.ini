; OBNG-test.ini for the OCCLUSION probe: the game runs its own code, nothing
; routed or shadowed; OBNG.dll samples one eye pass in 31 and asks, per
; geometry drawn in it, whether the geometry's world bound lies behind the
; pass's finished depth buffer ([Probe] Occlusion=1, plugin/src/
; OcclusionProbe.cpp). Written by tools/shadow-run.sh --ini; see
; tools/hand-scripts/obng-occlusion.txt.
[Shadow]
TimeInfoUpdate=0
TimeInfoInit=0
TimeInfoFreeze=0
TimeInfoUnfreeze=0
LoadingMenuTick=0
LoadingMenuCtor=0
RangeWalk=0
[Route]
RangeWalk=0
StereoDraw=0
[Probe]
FpuControlWord=0
HavokPlanner=0
CallCounters=0
PassSteps=0
PackCache=0
ConstantUploads=0
ViewConstants=0
DrawEntries=0
Occlusion=1
OcclusionEvery=31
Memory=1
[Log]
MismatchLines=20
SummaryEverySeconds=5
SummaryTimer=1
